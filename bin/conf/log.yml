logs:
  - name: root
    level: info
    formatter: "%d{%Y-%m-%d %H:%M:%S.%f}%T%t%T%N%T%F%T[%p]%T[%c]%T%f:%l%T%m%n"
    appenders:
      - type: FileLogAppender
        file: /home/blog/logs/root.log
      # - type: StdoutLogAppender
  - name: system
    level: info
    formatter: "%d{%Y-%m-%d %H:%M:%S.%f}%T%t%T%N%T%F%T[%p]%T[%c]%T%f:%l%T%m%n"
    appenders:
      - type: FileLogAppender
        file: /home/blog/logs/system.log
      # - type: StdoutLogAppender
  - name: access
    level: info
    formatter: "%d{%Y-%m-%d %H:%M:%S.%f}%T%t%T%N%T%F%T[%p]%T[%c]%T%f:%l%T%m%n"
    appenders:
      - type: FileLogAppender
        file: /home/blog/logs/access.log
      # - type: StdoutLogAppender
